#MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/roqui_games?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=abc123.

#Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Configuracion_Apliacion
springdoc.api-docs.path=/api-RoquiGames

spring.application.name=RoquiGames

# Configuración JWT

# Clave secreta utilizada para firmar y verificar los tokens.
jwt.secret=${JWT_SECRET}

# Tiempo de validez del token en milisegundos (24 horas).
jwt.expiration=86400000